name: Generate ESET License Key and send to Telegram

on:
  schedule:
    # Run at 08:00 AM (Vietnam time = UTC+7) on the 3rd of every month (01:00 UTC)
    - cron: '0 1 3 * *'
  # Allows manual run anytime from Actions tab
  workflow_dispatch:
    inputs:
      mail:
        description: 'Choose the mail provider'
        required: true
        type: choice
        options:
        - fakemail
        - emailfake
        - inboxes
        default: fakemail
      branch:
        description: 'Branch of etkg repo to clone'
        required: true
        type: string
        default: 'main'

jobs:
  Generate-and-Send:
    runs-on: ubuntu-latest
    steps:
      - name: 'Generate key and send to Telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ACCOUNT=0
          KEY=1
          SMALL_BUSINESS_KEY=1
          VPN=0
          
          EMAIL_API="${{ github.event.inputs.mail }}"
          if [ -z "$EMAIL_API" ]; then
            EMAIL_API="fakemail"
          fi
          
          TARGET_BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="main"
          fi
          
          git clone -b $TARGET_BRANCH --depth 1 https://github.com/shadowcopyrz/etkg.git
          cd etkg
          
          # Setup env
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          
          echo "Test results:" >> $GITHUB_STEP_SUMMARY
          
          if [[ ${ACCOUNT} != 0 ]]
          then
            for ((attempt=1;attempt<=${ACCOUNT};++attempt))
            do
              python3 main.py --auto-detect-browser --account --email-api ${EMAIL_API} --skip-update-check --no-logo --disable-progress-bar --disable-logging
            done
            echo -e "\nAccounts generated:" >> $GITHUB_STEP_SUMMARY
            cat ./*ACCOUNTS.txt >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ ${KEY} != 0 ]]
          then
            for ((attempt=1;attempt<=${KEY};++attempt))
            do
              python3 main.py --auto-detect-browser --key --email-api ${EMAIL_API} --skip-update-check --no-logo --disable-progress-bar --disable-logging
            done
          fi
          
          if [[ ${SMALL_BUSINESS_KEY} != 0 ]]
          then
            for ((attempt=1;attempt<=${SMALL_BUSINESS_KEY};++attempt))
            do
              python3 main.py --auto-detect-browser --small-business-key --email-api ${EMAIL_API} --skip-update-check --no-logo --disable-progress-bar --disable-logging
            done
          fi
          
          if [[ ${VPN} != 0 ]]
          then
            for ((attempt=1;attempt<=${VPN};++attempt))
            do
              python3 main.py --auto-detect-browser --vpn-codes --email-api ${EMAIL_API} --skip-update-check --no-logo --disable-progress-bar --disable-logging
            done
          fi
          
          if [[ ${KEY} != 0 || ${SMALL_BUSINESS_KEY} != 0 || ${VPN} != 0 ]]
          then
            echo -e "\nKeys generated:" >> $GITHUB_STEP_SUMMARY
            cat ./*KEYS.txt >> $GITHUB_STEP_SUMMARY
          fi

          # Create send_telegram.py and execute
          cat << 'EOF' > send_telegram.py
          import os, glob, re, json, sys, urllib.request

          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')

          if not bot_token or not chat_id:
              print('[WARN] Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret.')
              sys.exit(0)

          key_files = glob.glob('*KEYS.txt')
          if not key_files:
              print('[WARN] No KEYS.txt file found.')
              sys.exit(0)

          with open(key_files[0], 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          name_m = re.search(r'License Name:\s*(.*)', content)
          key_m = re.search(r'License Key:\s*([A-Z0-9-]+)', content)
          date_m = re.search(r'License Out Date:\s*(.*)', content)

          lic_name = name_m.group(1).strip() if name_m else 'ESET HOME Security Premium'
          lic_key = key_m.group(1).strip() if key_m else 'N/A'
          lic_date = date_m.group(1).strip() if date_m else 'N/A'

          msg = (
              '🔑 *ESET License Key định kỳ (Ngày 03 hàng tháng)*\n\n'
              f'🛡 *Gói bản quyền:* `{lic_name}`\n'
              f'🔑 *License Key:* `{lic_key}`\n'
              f'📅 *Hạn dùng:* `{lic_date}`\n\n'
              '_(Nhấp vào mã key để copy nhanh)_'
          )

          url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
          payload = json.dumps({'chat_id': chat_id, 'text': msg, 'parse_mode': 'Markdown'}, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as resp:
                  print('[INFO] Successfully sent key to Telegram:', resp.read().decode('utf-8'))
          except Exception as e:
              print('[ERROR] Failed to send key to Telegram:', e)
          EOF

          python3 send_telegram.py
